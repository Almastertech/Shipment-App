name: shipments
description: Shipments Insurance Platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.0.3
  dio: ^5.9.0
  get_it: ^8.2.0
  logger: ^2.3.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: any
  go_router: ^17.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  country_picker: ^2.0.28
  phone_numbers_parser: ^9.0.28
  pinput: ^6.0.2
  skeletonizer: ^2.1.3
  smart_auth: ^3.2.0
  flutter_screenutil: ^5.9.3
  device_preview: ^1.3.1
  geolocator: ^14.0.2
  camera: ^0.11.2
  video_player: ^2.10.0
  image_picker: ^1.2.0
  file_picker: ^11.0.3
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^5.1.0
  fake_async: ^1.3.2
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/png/shops_hero.png
    - assets/images/
    - assets/images/png/
    - assets/images/svg/
    - assets/lottie/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
